[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
# "rt"/"rt-multi-thread"：--mcp-server 模式在 main 里自建 runtime，
# 跑词典/百科工具的异步 HTTP（reqwest 需要 IO driver，见 mcp_server.rs）
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }
# WebDAV 传输通道（src/webdav.rs）：stream feature 支持流式上传/下载；
# json feature 供 MCP 词典/百科工具解析 JSON 响应（src/mcp_server.rs）
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
# 备份归档（src/backup.rs）：内容哈希去重 + zip 打包
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
