name: Product requirement
description: Requirement processed by the Developer Waker after it enters an iteration
title: "[REQ] "
labels: ["flow:devops", "type:requirement", "status:backlog"]
body:
  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: Describe the user value and expected behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is explicitly in scope, and what should not change.
    validations:
      required: false
