name: CI

on:
  pull_request:
    branches: [main, 'iteration/**']
  push:
    branches: [main, 'iteration/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # coverage：v8 provider 在 vitest.config.ts 配了起步阈值，低于阈值即失败；
      # HTML 报告作为 artifact 留存，文本摘要进 Job Summary。
      - run: pnpm run test:coverage
      - name: Coverage 摘要与报告
        if: always()
        working-directory: apps/desktop
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
            const row = ([label, key]) => `| ${label} | ${total[key].pct}% |`;
            [
              "### Coverage 摘要", "",
              "| 指标 | 数值 |", "| --- | --- |",
              row(["语句", "statements"]),
              row(["分支", "branches"]),
              row(["函数", "functions"]),
              row(["行", "lines"]), "",
            ].forEach((line) => process.stdout.write(line + "\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/desktop/coverage
          retention-days: 14
      - run: pnpm run build

  rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 在 Linux 上编译所需的系统依赖（tauri.app 官方清单）
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo check
