name: DevOps Flow Event Router

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Existing DevOps pull request number to route after recovery
        required: true
        type: string
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  developer:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.milestone != null &&
      contains(github.event.issue.labels.*.name, 'flow:devops') &&
      contains(github.event.issue.labels.*.name, 'status:ready-dev') &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'status:ready-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Developer Waker
        env:
          QW_API_URL: ${{ secrets.QW_DEVELOPER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: devops
          QW_ROLE: developer
          QW_EVENT_TYPE: issue.ready-for-development
          QW_SESSION_ENTITY: issue:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"issueNumber":${{ github.event.issue.number }},"issueUrl":${{ toJSON(github.event.issue.html_url) }},"milestoneNumber":${{ github.event.issue.milestone.number }},"milestoneTitle":${{ toJSON(github.event.issue.milestone.title) }},"action":${{ toJSON(github.event.action) }}}
        run: node .github/scripts/invoke-waker.mjs

  reviewer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.draft == false &&
       (startsWith(github.event.pull_request.head.ref, 'devops/') ||
        contains(github.event.pull_request.body, '[QW-DEVOPS][DEV][READY]')) &&
       startsWith(github.event.pull_request.base.ref, 'iteration/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Resolve pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          pull_number="$EVENT_PULL_NUMBER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then pull_number="$INPUT_PULL_NUMBER"; fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}" > "$RUNNER_TEMP/devops-pr.json"
          echo "number=$(jq -r '.number' "$RUNNER_TEMP/devops-pr.json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' "$RUNNER_TEMP/devops-pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/devops-pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.head.ref' "$RUNNER_TEMP/devops-pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r '.base.ref' "$RUNNER_TEMP/devops-pr.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.draft' "$RUNNER_TEMP/devops-pr.json")" = "true" ] || ! jq -e '.base.ref | startswith("iteration/")' "$RUNNER_TEMP/devops-pr.json" >/dev/null || ! jq -e '(.head.ref | startswith("devops/")) or (.body // "" | contains("[QW-DEVOPS][DEV][READY]"))' "$RUNNER_TEMP/devops-pr.json" >/dev/null; then
            echo "The selected pull request is not a ready DevOps delivery" >&2
            exit 1
          fi
      - name: Verify pull request targets its Issue iteration
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ steps.pull.outputs.number }}
          ACTUAL_BASE: ${{ steps.pull.outputs.base_ref }}
        run: |
          issue_number="$(jq -r '(.body // "") | capture("(?m)^(Issue:|Resolves)[[:space:]]*#(?<number>[0-9]+)[[:space:]]*$").number // empty' "$RUNNER_TEMP/devops-pr.json")"
          if [ -z "$issue_number" ]; then echo "DevOps PR has no Issue reference" >&2; exit 1; fi
          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")"
          milestone_number="$(jq -r '.milestone.number // empty' <<<"$issue_json")"
          if [ -z "$milestone_number" ]; then echo "Linked Issue has no Milestone" >&2; exit 1; fi
          comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100")"
          if [ "$(jq 'length' <<<"$comments_json")" -eq 0 ]; then
            parent_number="$(jq -r '(.body // "") | capture("(?m)^Parent:[[:space:]]*#(?<number>[0-9]+)[[:space:]]*$").number // empty' <<<"$issue_json")"
            if [ -n "$parent_number" ]; then
              comments_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${parent_number}/comments?per_page=100")"
            fi
          fi
          expected_base="$(jq -r --arg marker "[QW-DEVOPS][RELEASE][milestone:${milestone_number}][BRANCH_READY] " '[.[].body | select(contains($marker)) | split($marker)[1] | split("\n")[0]][-1] // empty' <<<"$comments_json")"
          if [ -z "$expected_base" ] || [ "$ACTUAL_BASE" != "$expected_base" ]; then
            echo "DevOps PR targets wrong iteration: actual=$ACTUAL_BASE expected=$expected_base" >&2
            exit 1
          fi
      - name: Wake Reviewer Waker
        env:
          QW_API_URL: ${{ secrets.QW_REVIEWER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: devops
          QW_ROLE: reviewer
          QW_EVENT_TYPE: pull-request.content-revision
          QW_SESSION_ENTITY: pr:${{ steps.pull.outputs.number }}:sha:${{ steps.pull.outputs.head_sha }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ steps.pull.outputs.number }},"pullUrl":${{ toJSON(steps.pull.outputs.url) }},"action":${{ toJSON(github.event.action || 'recovery') }},"headSha":${{ toJSON(steps.pull.outputs.head_sha) }},"headRef":${{ toJSON(steps.pull.outputs.head_ref) }},"baseRef":${{ toJSON(steps.pull.outputs.base_ref) }}}
        run: node .github/scripts/invoke-waker.mjs

  tester:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'devops/') ||
       contains(github.event.pull_request.body, '[QW-DEVOPS][DEV][READY]')) &&
      startsWith(github.event.pull_request.base.ref, 'iteration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Tester Waker
        env:
          QW_API_URL: ${{ secrets.QW_TESTER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: devops
          QW_ROLE: tester
          QW_EVENT_TYPE: pull-request.merged-to-iteration
          QW_SESSION_ENTITY: pr:${{ github.event.pull_request.number }}:sha:${{ github.event.pull_request.merge_commit_sha }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ github.event.pull_request.number }},"pullUrl":${{ toJSON(github.event.pull_request.html_url) }},"mergeSha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"headRef":${{ toJSON(github.event.pull_request.head.ref) }},"iterationBranch":${{ toJSON(github.event.pull_request.base.ref) }}}
        run: node .github/scripts/invoke-waker.mjs

  release-finalize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'iteration/') &&
      contains(github.event.pull_request.body, '[QW-DEVOPS][RELEASE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Release Waker after main merge
        env:
          QW_API_URL: ${{ secrets.QW_RELEASE_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: devops
          QW_ROLE: release
          QW_EVENT_TYPE: iteration.merged-to-main
          QW_SESSION_ENTITY: pr:${{ github.event.pull_request.number }}:sha:${{ github.event.pull_request.merge_commit_sha }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ github.event.pull_request.number }},"mergeSha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"iterationBranch":${{ toJSON(github.event.pull_request.head.ref) }}}
        run: node .github/scripts/invoke-waker.mjs
