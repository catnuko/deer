name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "验证构建：不创建/上传 Release，产物仅存为 artifact"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.release.outputs.created == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  build:
    needs: release
    # 只在新版本 tag 创建（或 dry_run 手动验证）时构建，普通 push 不跑，控制 macOS runner 成本
    if: needs.release.outputs.created == 'true' || inputs.dry_run == true
    # macos-14 标签已退役（runner 分配直接报 "configuration not supported"），改用 macos-latest（Apple Silicon）
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build macOS bundle
        run: pnpm tauri build

      - name: Locate bundle
        id: bundle
        run: |
          DMG="$(find apps/desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -n 1)"
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found in bundle directory"
            exit 1
          fi
          echo "dmg=${DMG}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle to Release
        if: inputs.dry_run != true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: gh release upload "${{ needs.release.outputs.tag }}" "${{ steps.bundle.outputs.dmg }}" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload bundle as artifact (dry run)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.bundle.outputs.dmg }}
          retention-days: 7
