name: Start DevOps Iteration

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: Iteration / Milestone name
        required: true
        default: Deer-01
      requirement:
        description: Requirement title shown to the team
        required: true
        default: 阅读进度与章节总结
      test_mode:
        description: Test path
        required: true
        default: pass
        type: choice
        options: [pass, fail-once]

permissions:
  contents: write
  issues: write

jobs:
  create-iteration-and-requirement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create milestone and requirement
        id: bootstrap
        uses: actions/github-script@v7
        env:
          ITERATION: ${{ inputs.iteration }}
          REQUIREMENT: ${{ inputs.requirement }}
          TEST_MODE: ${{ inputs.test_mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ITERATION.trim();
            const milestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all' });
            const duplicate = milestones.find(item => item.title === title);
            if (duplicate) {
              core.setFailed(`Iteration name already exists: ${title}. Start a new run with a unique suffix.`);
              return;
            }
            const milestone = (await github.rest.issues.createMilestone({ owner, repo, title })).data;
            const labels = ['flow:devops', 'type:requirement', 'status:backlog'];
            if (process.env.TEST_MODE === 'fail-once') labels.push('devops:test-fail-once');
            const body = [
              '## 需求', '', process.env.REQUIREMENT, '',
              '## 验收标准', '',
              '- 实现需求中描述的用户可见行为。',
              '- 补充或更新自动化测试。',
              '- `npm run lint`、`npm test`、`npm run build` 全部通过。',
              '- 不引入与本需求无关的改动。', '',
              '> Managed by the QoderWake GitHub DevOps flow.',
            ].join('\n');
            const issue = (await github.rest.issues.create({
              owner, repo, title: process.env.REQUIREMENT, body,
              milestone: milestone.number, labels,
            })).data;
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || `iteration-${milestone.number}`;
            core.setOutput('milestone_number', String(milestone.number));
            core.setOutput('issue_number', String(issue.number));
            core.setOutput('iteration_branch', `iteration/${slug}`);
      - name: Wake Release Waker
        env:
          QW_API_URL: ${{ secrets.QW_RELEASE_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: devops
          QW_ROLE: release
          QW_EVENT_TYPE: iteration.created
          QW_SESSION_ENTITY: milestone:${{ steps.bootstrap.outputs.milestone_number }}
          QW_CONTEXT_JSON: >-
            {"milestoneNumber":${{ steps.bootstrap.outputs.milestone_number }},"issueNumber":${{ steps.bootstrap.outputs.issue_number }},"iterationName":${{ toJSON(inputs.iteration) }},"iterationBranch":${{ toJSON(steps.bootstrap.outputs.iteration_branch) }}}
        run: node .github/scripts/invoke-waker.mjs
